services:
  # Web Service
  - type: web
    name: campusguard
    runtime: python
    plan: free  # Change to starter or higher for production
    buildCommand: "./build.sh"
    startCommand: "gunicorn campusguard.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: lagoscp-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FACE_RECOGNITION_PROVIDER
        value: "facepp"
      - key: FACEPP_API_KEY
        sync: false
      - key: FACEPP_API_SECRET
        sync: false
      - key: FACEPP_THRESHOLD
        value: "80"
      - key: FACEPP_OUTER_ID
        value: "lagoscp_faceset"
      - key: COMPREFACE_URL
        sync: false
      - key: COMPREFACE_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
    healthCheckPath: /admin/

  # PostgreSQL Database
  - type: pgsql
    name: lagoscp-db
    plan: free  # Change to starter or higher for production
    databaseName: lagoscp_db
    user: lagoscp_user
