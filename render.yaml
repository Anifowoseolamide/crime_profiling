services:
  # Web Service
  - type: web
    name: campusguard
    runtime: python
    plan: free  # Change to starter or higher for production
    buildCommand: "./build.sh"
    startCommand: "gunicorn campusguard.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: campusguard-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: LASU_API_URL
        sync: false
      - key: LASU_API_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
    healthCheckPath: /admin/

  # PostgreSQL Database
  - type: pgsql
    name: campusguard-db
    plan: free  # Change to starter or higher for production
    databaseName: campusguard_db
    user: campusguard_user
